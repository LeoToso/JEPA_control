environment:
  name: cartpole
  frame_skip: 5
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8
  action_latent_dim: 8
  action_encoder: linear
  image_size: 64
  patch_size: 8
  frame_stack: 1
  predictor_window: 3
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_type: transformer
  predictor_embed_dim: 128
  predictor_depth: 3
  predictor_num_heads: 4
  predictor_mlp_ratio: 4.0

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 100
  horizon: 5
  # ── Phase 3v7: freeze encoder; reduced lambda_fp to let B grow ──────────────
  # mixed data: large-init random (v3) + near-eq random (v3_neareq) + passive (v3_passive)
  # B_align removed (B_target at x* is 8x smaller than true physical B at non-eq states)
  # lambda_fp reduced from 0.5→0.05 to allow pred_loss to push B_magnitude up organically
  freeze_encoder_at_epoch: 0
  freeze_action_proj_at_epoch: -1
  # ── Losses ────────────────────────────────────────────────────────────────
  lambda_pred: 1.0
  lambda_fp: 0.05
  lambda_B_align: 0.0
  lambda_action_reconstruction: 0.0
  # ── All other losses off ─────────────────────────────────────────────────
  lambda_state: 0.0
  state_loss_weights: [1.0, 10.0, 100.0, 10.0]
  state_encoder_grad_scale: 1.0
  lambda_sigreg: 0.0
  sigreg_num_slices: 64
  sigreg_num_points: 9
  sigreg_all_steps: true
  lambda_inv: 0.0
  inv_frames: 5
  inv_action_scale: 10.0
  inv_hidden_dim: 128
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  use_vicreg: false
  vicreg_lambda: 5.0
  vicreg_nu: 1.0
  lambda_pred_vicreg: 0.0
  lambda_mirror: 0.0
  lambda_spec: 0.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  lambda_PBH: 0.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  lambda_dynSIG: 0.0
  lambda_varfloor: 0.0
  lambda_temp: 0.0
  # ── Training dynamics ─────────────────────────────────────────────────────
  use_target_encoder: false
  detach_targets: false
  target_encoder_momentum: 0.996
  aug_noise_std: 0.0
  predictor_lr_mult: 5.0
  predictor_window: 3
  num_workers: 2
  checkpoint_every: 10
  warmup_epochs: 0
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 0
  encoder_lr_unfreeze_mult: 1.0
  jacobian_every: 10
  rho_max_init: 1.5
  local_state_threshold: 0.05
  unstable_eta: 0.05
  normalize_actions: true
  normalize_states: true

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 0.3
  n_trials: 50

data:
  train_frac: 0.85
  val_frac: 0.10
