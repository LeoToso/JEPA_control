environment:
  name: cartpole
  frame_skip: 1
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 32
  action_latent_dim: 32
  action_encoder: none
  patch_size: 8
  frame_stack: 2              # stack 2 consecutive frames (6 ch) to encode velocity
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_hidden_dim: 256
  predictor_n_layers: 2

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 128
  epochs: 200
  horizon: 5
  lambda_pred: 1.0
  lambda_state: 0.0        # no state supervision at any phase (no state labels used)
  lambda_anchor: 0.0       # state_head equilibrium anchor: disabled (no state supervision)
  lambda_enc_anchor: 0.0   # disabled: with no warmup, this pushes toward collapse
  lambda_inv: 1.0          # inverse dynamics: ||ψ(z_t, z_{t+1}) - u_t/scale||^2 (RichID-style)
  inv_action_scale: 10.0   # normalise actions by ±10 range so inv_loss ~ O(1)
  lambda_fp: 1.0           # small regularizer only — self-loop pred_loss is the main fp signal
  lambda_spec: 5.0
  lambda_PBH: 5.0          # was 1.0 — counteract B_jac collapse from strong fp; keeps mu_S > delta_tol
  jacobian_every: 20
  use_vicreg: false
  vicreg_lambda: 5.0
  lambda_sigreg: 5.0       # was 25.0 — lighter collapse guard; allows more structured representation
  sigreg_num_slices: 128   # 128 slices sufficient for D=32; paper uses 1024 for large D
  sigreg_num_points: 17    # frequency evaluation points per slice
  vicreg_nu: 1.0
  ema_momentum: 0.996
  state_encoder_grad_scale: 0.50
  predictor_lr_mult: 1.0
  checkpoint_every: 50
  warmup_epochs: 0          # no warmup: all losses active + encoder trainable from epoch 1
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 9999
  encoder_lr_unfreeze_mult: 0.1

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 50
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

mpc:
  horizon: 10
  chunk_size: 1
  Q_f_multiplier: 10.0
  grad_lr: 0.05
  grad_n_iter: 100

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 3.0
  n_trials: 50

data:
  n_random: 50000
  train_frac: 0.8
  val_frac: 0.1
  random_init_range: 0.30   # was 0.15 — more extreme starts for larger obs-to-obs deltas
  lqr_init_range: 0.10
  lqr_noise_std: 0.1
  n_equilibrium: 500        # was 5000 — fewer near-zero-action samples that enable shortcuts
  n_eq_selfloop: 2000       # true zero-velocity self-loop transitions injected into train set
  eq_init_range: 0.002
  eq_noise_std: 0.001
