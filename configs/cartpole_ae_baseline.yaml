environment:
  name: cartpole
  frame_skip: 1
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 4             # matches physical state dim (x, ẋ, θ, θ̇) — hard bottleneck
  action_latent_dim: 1      # scalar action, no lifting needed at d=4
  action_encoder: linear
  patch_size: 8
  frame_stack: 2            # 2 consecutive frames → encoder sees [obs_{t-1}, obs_t] → velocity info
  predictor_window: 3
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_hidden_dim: 64
  predictor_n_layers: 2

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 80
  horizon: 10
  # ── Loss weights ──────────────────────────────────────────────────────────
  lambda_dmd_pixel: 5.0    # MAIN: pixel prediction via per-batch DMD (stable pixel targets)
  lambda_recon: 1.0        # reconstruction: decoder(encoder(obs)) ≈ obs (prevents collapse)
  lambda_pred: 0.5         # CEM predictor (secondary — predictor network for nonlinear planning)
  lambda_fp: 5.0           # fixed-point: predictor(z*, 0) = z*
  # ── DMD parameters ────────────────────────────────────────────────────────
  # With d=4: context_len=8 → 256*8=2048 equations for 4*4+4=20 unknowns (100:1)
  # Per-trajectory would give 8 eqs for 20 unknowns (underdetermined), so batch DMD
  # is correct here.  Bounou et al. used per-trajectory with d=4 + long context (50+).
  dmd_context_len: 8       # 8 context steps (was 5; more equations → better A,B estimate)
  dmd_ridge: 1.0e-4        # ridge regularization for normal equations stability
  # ── No collapse prevention needed: reconstruction loss anchors encoder ────
  # x IS encoded (|r|≈0.75). The real problem is θ under-encoding: with d=32,
  # the encoder lazily encodes x (dominant pixel signal) and ignores θ.
  # Fix: reduce latent_dim to 4 (matching physical state dimension), which is
  # the hard bottleneck used in Bounou et al. 2021.
  use_vicreg: false
  # ── No EMA target encoder: pixel targets are stable, no moving-target issue ─
  target_encoder_momentum: 0.9995   # kept for backwards-compat but not used
  aug_noise_std: 0.0
  checkpoint_every: 10

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 3.0
  n_trials: 30

data:
  n_random: 20000
  train_frac: 0.8
  val_frac: 0.1
  random_init_range: 1.0
  lqr_init_range: 0.30
  lqr_noise_std: 0.25
  n_equilibrium: 500
  n_eq_selfloop: 200
  eq_init_range: 0.002
  eq_noise_std: 0.001
  n_pe: 2000
  pe_init_range: 0.05
  pe_action_amplitude: 3.0
  pe_flip_prob: 0.15
  pe_max_ep_len: 40
