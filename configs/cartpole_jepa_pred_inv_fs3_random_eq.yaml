environment:
  name: cartpole
  frame_skip: 3
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8
  action_latent_dim: 1
  action_encoder: linear
  patch_size: 8
  frame_stack: 2
  predictor_window: 3
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_hidden_dim: 64
  predictor_n_layers: 3

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 500
  horizon: 30
  # ── Active losses ─────────────────────────────────────────────────────────
  lambda_pred: 1.0
  # SIGreg contracts z-mean (bias) toward 0 but gradient vanishes at small
  # variance → z collapses even with pred disabled. VICReg variance term is
  # stronger: grad ∝ (z-mean)/std which expands inter-sample variance even at
  # tiny std (gradient ~2.45/elem vs SIG ~0.047/elem at std=0.02).
  lambda_sigreg: 0.0
  sigreg_num_slices: 32
  sigreg_num_points: 9
  sigreg_all_steps: true
  # ── Multi-step centered IDM: (z_{t-2}, z_{t-1}, z_t, z_{t+1}, z_{t+2}) → u_t
  # With frame_skip=3 (dt_eff=0.06s), consecutive frames are 3× more different
  # visually → encoder learns xdot/thetadot better → stronger IDM signal.
  # 5-frame window gives context to subtract state-dependent drift around t.
  lambda_inv: 1.0
  inv_frames: 5
  inv_action_scale: 10.0
  inv_hidden_dim: 128
  # ── fp anchor to keep rho(A_aug) > 1 ────────────────────────────────────
  # With frame_skip=3: true unstable eig ≈ exp(4.43*0.06) ≈ 1.305 (more unstable).
  lambda_fp: 0.1
  # ── All other losses off ─────────────────────────────────────────────────
  lambda_state: 0.0
  lambda_mirror: 0.0
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  lambda_spec: 0.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  lambda_PBH: 0.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  lambda_dynSIG: 0.0
  lambda_varfloor: 0.0
  lambda_temp: 0.0
  use_vicreg: true
  vicreg_lambda: 25.0   # strong variance floor: forces std(z_i)≥1 per dim
  vicreg_nu: 1.0        # covariance decorrelation weight
  # ── No EMA, no stop-gradient ─────────────────────────────────────────────
  use_target_encoder: false
  detach_targets: false
  target_encoder_momentum: 0.99
  aug_noise_std: 0.0
  state_encoder_grad_scale: 1.0
  # Predictor must be FASTER than encoder (detach_targets=False): slow predictor
  # means E[f(z)]≈0 for many epochs → pred gradient acts as z→0 regularization
  # → collapse. With predictor 5× faster, it adapts within epoch 1 so pred
  # gradient becomes true prediction error (structured), not "shrink z to 0".
  predictor_lr_mult: 5.0
  predictor_window: 3
  checkpoint_every: 10
  # warmup_epochs=1: one pred-free epoch (SIG+IDM only, no collapse pressure)
  # triggers the freeze mechanism. Encoder is then frozen for 5 epochs so the
  # predictor (lr=5e-4) fully adapts to fixed z. After epoch 6 the encoder
  # unfreezes with a pre-trained predictor → pred gradient is structured
  # (prediction error), never "E[f(z)]≈0 → shrink z to 0".
  warmup_epochs: 1
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 5
  encoder_lr_unfreeze_mult: 1.0
  jacobian_every: 10
  rho_max_init: 1.5
  local_state_threshold: 0.05
  unstable_eta: 0.05
  # ── Normalization ────────────────────────────────────────────────────────
  normalize_actions: true
  normalize_states: true

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 0.3
  n_trials: 50

data:
  train_frac: 0.8
  val_frac: 0.1
  n_random_episodes: 100
  random_ep_len: 200
  random_init_range: 1.0
  n_lqr_episodes: 0
  lqr_ep_len: 200
  lqr_init_range: 0.30
  lqr_noise_std: 0.25
  n_equilibrium: 5
  eq_ep_len: 50
  n_eq_selfloop: 0
  eq_init_range: 0.05
  eq_noise_std: 0.001
  n_pe_episodes: 5
  pe_ep_len: 40
  pe_init_range: 0.05
  pe_action_amplitude: 3.0
  pe_flip_prob: 0.15
  n_passive_episodes: 0
  passive_ep_len: 50
  passive_init_range: 0.05
