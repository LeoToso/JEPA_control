model:
  encoder_type: dinov2
  dinov2_variant: dinov2_vits14      # embed_dim=384; frozen pretrained
  image_size: 196                    # DINOv2 ViT-S/14: 14×14 patches → 14²=196 tokens
  use_frame_diff: false              # DINOv2 expects RGB, not frame-difference
  use_proprio: true
  proprio_dim: 4
  history_size: 1
  action_context_dim: 10             # frame_skip=5 × 2-D sub-actions per step
  use_action_history: false          # 10-D multi-action for current step only
  predictor_hidden_dim: 384          # matches DINOv2 embed_dim
  predictor_depth: 6
  predictor_heads: 16
  predictor_dim_head: 64
  predictor_mlp_dim: 2048
  predictor_dropout: 0.1
  use_inverse_model: false
  use_state_decoder: false

training:
  epochs: 200
  batch_size: 64
  num_workers: 2
  lr: 1.0e-4
  warmup_epochs: 5
  min_lr: 1.0e-6
  weight_decay: 1.0e-3
  lambda_fwd: 0.0
  lambda_inverse: 0.0
  lambda_sigreg: 0.0
  lambda_state_recon: 0.0
  lambda_rollout: 1.0
  lambda_inverse_1step: 0.0
  horizon: 3
  normalize_actions: true
  balanced_sampling: false
  checkpoint_every: 10
  probe_every: 10
