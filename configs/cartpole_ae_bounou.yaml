environment:
  name: cartpole
  frame_skip: 1
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8             # n_z=8 as in Bounou et al. 2021
  action_latent_dim: 1      # scalar action, no lifting at d=8
  action_encoder: linear
  encoder_type: cnn         # Bounou et al. exact CNN (6 conv-blocks, symmetric decoder)
  patch_size: 8
  frame_stack: 2            # 2 consecutive frames → encoder sees position + velocity
  predictor_window: 3       # kept but predictor not used for planning
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_hidden_dim: 64
  predictor_n_layers: 2

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 200
  horizon: 10
  predictor_window: 3
  # ── Loss weights (faithful Bounou: only DMD pixel + reconstruction) ───────
  lambda_dmd_pixel: 5.0    # MAIN: pixel prediction via per-batch DMD
  lambda_recon: 1.0        # reconstruction: prevents encoder collapse
  lambda_pred: 0.0         # DISABLED: MLP predictor not used in Bounou's method
  lambda_fp: 0.0           # DISABLED: no fixed-point loss (DMD handles this)
  # ── All JEPA-specific regularization disabled ─────────────────────────────
  lambda_spec: 0.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  lambda_PBH: 0.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  lambda_dynSIG: 0.0
  lambda_sigreg: 0.0
  lambda_varfloor: 0.0
  lambda_temp: 0.0
  lambda_state: 0.0
  lambda_mirror: 0.0
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  lambda_inv: 0.0
  use_target_encoder: false
  jacobian_every: 9999
  # ── DMD parameters ────────────────────────────────────────────────────────
  dmd_context_len: 5
  dmd_ridge: 1.0e-4
  # ── Collapse prevention ───────────────────────────────────────────────────
  use_vicreg: false
  vicreg_lambda: 25.0
  vicreg_nu: 1.0
  target_encoder_momentum: 0.9995
  aug_noise_std: 0.0
  checkpoint_every: 10

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 3.0
  n_trials: 30

data:
  train_frac: 0.8
  val_frac: 0.1
  # Random: 50 ep × 200 steps = 10,000 transitions (wide exploration)
  n_random_episodes: 50
  random_ep_len: 200
  random_init_range: 1.0
  # LQR: 100 ep × 100 steps = 10,000 near-equilibrium transitions.
  # Bounou's global DMD needs near-z* data to identify the linearised
  # dynamics accurately — unlike CEM, DMD-LQR benefits from LQR data.
  n_lqr_episodes: 100
  lqr_ep_len: 100
  lqr_init_range: 0.10
  lqr_noise_std: 0.0
  # Equilibrium: 500 self-loop + 200 eq transitions at z* (tiny u)
  n_equilibrium: 500
  eq_ep_len: 50
  n_eq_selfloop: 200
  eq_init_range: 0.002
  eq_noise_std: 0.001
  # PRBS: persistent excitation to identify B accurately
  n_pe_episodes: 50
  pe_ep_len: 40
  pe_init_range: 0.05
  pe_action_amplitude: 3.0
  pe_flip_prob: 0.15
  # Passive: 200 ep × 50 steps (falling dynamics)
  n_passive_episodes: 200
  passive_ep_len: 50
  passive_init_range: 0.05
