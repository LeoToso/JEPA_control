environment:
  name: cartpole
  frame_skip: 5
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8
  action_dim: 1                 # scalar action (normalised u ∈ [-1,1])
  action_latent_dim: 1          # 1→1 learnable scalar weight
  action_encoder: linear
  encoder_type: cnn             # CNN encoder (paper §2.1)
  image_size: 64
  patch_size: 8                 # unused for CNN
  frame_stack: 2                # stack [prev, curr] channel-wise → 6 input channels
  use_frame_diff: false         # pure 2-frame stack, no explicit diff channel
  vit_embed_dim: 128            # unused for CNN
  vit_depth: 3
  vit_num_heads: 4
  vit_mlp_ratio: 2.0
  predictor_type: mlp
  predictor_window: 3
  predictor_hidden_dim: 64
  predictor_n_layers: 2         # 2 hidden layers + 1 output
  predictor_activation: relu
  # Transformer params kept for reference (unused)
  predictor_embed_dim: 128
  predictor_depth: 3
  predictor_num_heads: 4
  predictor_mlp_ratio: 4.0

training:
  lr: 1.0e-4                    # paper §4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 200
  horizon: 10
  # ── Prediction loss ───────────────────────────────────────────────────────
  lambda_pred: 1.0
  # ── State supervision: λ_state=1, λ_pred_state=1  (Run E = §6 Table 3) ──
  lambda_state: 1.0
  state_loss_weights: [50.0, 0.1, 100.0, 10.0]   # w=[x,xdot,theta,thetadot]
  state_encoder_grad_scale: 1.0                    # α_s=1 (full gradient)
  # ── Predictor state loss ON for Run E ─────────────────────────────────────
  lambda_state_pred: 1.0
  # ── Fixed-point loss OFF ──────────────────────────────────────────────────
  lambda_fp: 0.0
  # ── SIGreg ────────────────────────────────────────────────────────────────
  lambda_sigreg: 1.0
  sigreg_num_slices: 32         # S=32 projections (paper §5.2)
  sigreg_num_points: 9          # m=9 quadrature points
  sigreg_all_steps: true
  # ── All other losses off ─────────────────────────────────────────────────
  lambda_inv: 0.0
  inv_frames: 5
  inv_action_scale: 10.0
  inv_hidden_dim: 128
  lambda_action_reconstruction: 0.0
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  use_vicreg: false
  vicreg_lambda: 5.0
  vicreg_nu: 1.0
  lambda_pred_vicreg: 0.0
  lambda_mirror: 0.0
  lambda_spec: 0.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  lambda_PBH: 0.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  lambda_dynSIG: 0.0
  lambda_varfloor: 0.0
  lambda_temp: 0.0
  lambda_B_align: 0.0
  # ── Training dynamics ─────────────────────────────────────────────────────
  use_target_encoder: false
  detach_targets: false
  target_encoder_momentum: 0.996
  aug_noise_std: 0.0
  predictor_lr_mult: 1.0        # no predictor LR boost in paper
  predictor_window: 3
  num_workers: 2
  checkpoint_every: 10
  warmup_epochs: 0
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 0
  encoder_lr_unfreeze_mult: 1.0
  jacobian_every: 10
  rho_max_init: 1.5
  local_state_threshold: 0.05
  unstable_eta: 0.05
  normalize_actions: true
  normalize_states: true

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 15
  chunk_size: 1
  n_samples: 2000
  n_elites: 100
  n_iter: 15
  init_std: 1.0
  n_trials: 50

data:
  train_frac: 0.8
  val_frac: 0.1
  # ── Dataset composition (paper §3, Table 2) ───────────────────────────────
  n_random_episodes: 50
  random_ep_len: 200
  random_init_range: 1.0
  n_lqr_episodes: 100
  lqr_ep_len: 100
  lqr_init_range: 0.10
  lqr_noise_std: 0.0
  n_equilibrium: 500
  n_pe_episodes: 50
  pe_ep_len: 40
  pe_init_range: 0.05
  pe_action_amplitude: 3.0
  pe_flip_prob: 0.15
  n_passive_episodes: 200
  passive_ep_len: 50
  passive_init_range: 0.05
