environment:
  name: cartpole
  # Five physics steps = 0.1 s between rendered frames. At 64x64 this makes
  # velocity and action effects visible; frame_skip=1 was often subpixel.
  frame_skip: 5
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8
  action_dim: 1
  action_latent_dim: 1
  action_encoder: none
  encoder_type: cnn
  image_size: 64
  patch_size: 8
  frame_stack: 2
  use_frame_diff: false
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  vit_mlp_ratio: 2.0
  predictor_type: mlp
  predictor_window: 1
  predictor_hidden_dim: 128
  predictor_n_layers: 2
  predictor_activation: relu
  predictor_embed_dim: 128
  predictor_depth: 3
  predictor_num_heads: 4
  predictor_mlp_ratio: 4.0

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 150
  horizon: 3

  # Forty epochs establish a physically meaningful visual representation.
  # Prediction and predictor-state supervision are disabled in warmup.
  # Strong SIGReg is active from epoch 1 to prevent constant-latent collapse.
  warmup_epochs: 40
  warmup_lambda_state: 1.0
  warmup_lambda_state_pred: 0.0
  warmup_lambda_sigreg: 1.0
  freeze_encoder_epochs: 20
  encoder_lr_unfreeze_mult: 0.1

  lambda_pred: 1.0
  lambda_state: 1.0
  lambda_state_pred: 0.1
  lambda_sigreg: 0.01
  lambda_fp: 0.1

  state_loss_weights: [1.0, 1.0, 1.0, 1.0]
  state_encoder_grad_scale: 1.0
  normalize_actions: true
  normalize_states: true

  detach_targets: true
  use_target_encoder: true
  target_encoder_momentum: 0.99
  aug_noise_std: 0.0
  predictor_lr_mult: 1.0

  sigreg_sampling: random_step
  sigreg_all_steps: false
  sigreg_num_slices: 64
  sigreg_num_points: 9

  lambda_anchor: 0.0
  state_equilibrium_anchor_weight: 0.0
  lambda_enc_anchor: 0.0
  lambda_inv: 0.0
  lambda_action_reconstruction: 0.0
  lambda_pred_vicreg: 0.0
  use_vicreg: false
  lambda_mirror: 0.0
  lambda_spec: 0.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  lambda_PBH: 0.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  lambda_dynSIG: 0.0
  lambda_varfloor: 0.0
  lambda_temp: 0.0
  lambda_B_align: 0.0
  compute_B_diagnostic: false

  predictor_window: 1
  num_workers: 2
  checkpoint_every: 10
  jacobian_every: 10
  rho_max_init: 1.5
  local_state_threshold: 0.05
  unstable_eta: 0.05

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 15
  chunk_size: 1
  n_samples: 2000
  n_elites: 100
  n_iter: 15
  init_std: 1.0
  n_trials: 50

data:
  # Keep all supervised states inside the observable rendering region.
  max_abs_x: 2.2
  max_abs_theta: 1.2
  train_frac: 0.8
  val_frac: 0.1
  n_random_episodes: 50
  random_ep_len: 200
  random_init_range: 1.0
  n_lqr_episodes: 100
  lqr_ep_len: 100
  lqr_init_range: 0.10
  lqr_noise_std: 0.0
  n_equilibrium: 500
  n_pe_episodes: 50
  pe_ep_len: 40
  pe_init_range: 0.05
  pe_action_amplitude: 3.0
  pe_flip_prob: 0.15
  n_passive_episodes: 200
  passive_ep_len: 50
  passive_init_range: 0.05
