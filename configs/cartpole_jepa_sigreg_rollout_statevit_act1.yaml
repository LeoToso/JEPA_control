model:
  encoder_type: state_vit           # Transformer over per-feature state tokens; images ignored
  use_frame_diff: false
  use_proprio: true
  proprio_dim: 4
  state_vit_embed_dim: 192          # matches image ViT embed_dim for fair comparison
  state_vit_depth: 4                # matches image ViT depth
  state_vit_heads: 3                # matches image ViT heads
  latent_dim: 192
  history_size: 1
  action_context_dim: 1            # single 1-D macro-action (Markovian)
  use_action_history: false
  predictor_hidden_dim: 192
  predictor_depth: 6
  predictor_heads: 16
  predictor_dim_head: 64
  predictor_mlp_dim: 2048
  predictor_dropout: 0.1
  use_inverse_model: false
  use_inverse_model_1step: false
  use_state_decoder: false

training:
  epochs: 200
  batch_size: 64
  num_workers: 0
  lr: 1.0e-4
  warmup_epochs: 5
  min_lr: 1.0e-6
  weight_decay: 1.0e-3
  lambda_fwd: 0.0
  lambda_inverse: 0.0
  lambda_sigreg: 1.0
  lambda_state_recon: 0.0
  lambda_rollout: 1.0
  lambda_inverse_1step: 0.0
  horizon: 3
  normalize_actions: true
  balanced_sampling: false
  checkpoint_every: 10
  probe_every: 10
