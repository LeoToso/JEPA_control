environment:
  name: cartpole
  frame_skip: 5
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8
  action_latent_dim: 8
  action_encoder: linear
  encoder_type: vit
  image_size: 64
  patch_size: 8
  frame_stack: 1
  use_frame_diff: true          # encoder receives [o_{t-1}, o_t, o_t - o_{t-1}] (9ch)
  vit_embed_dim: 128
  vit_depth: 3
  vit_num_heads: 4
  vit_mlp_ratio: 2.0
  predictor_type: transformer
  predictor_window: 3
  predictor_embed_dim: 128
  predictor_depth: 3
  predictor_num_heads: 4
  predictor_mlp_ratio: 4.0

training:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 500
  horizon: 10
  # ── Prediction loss ───────────────────────────────────────────────────────
  lambda_pred: 1.0
  # ── State reconstruction ─────────────────────────────────────────────────
  lambda_state: 2.0
  state_loss_weights: [2.0, 20.0, 100.0, 20.0]   # [x, ẋ, θ, θ̇]
  state_encoder_grad_scale: 1.0
  # ── SIGreg ────────────────────────────────────────────────────────────────
  lambda_sigreg: 1.0
  sigreg_num_slices: 64
  sigreg_num_points: 9
  sigreg_all_steps: true
  # ── Fixed-point loss ──────────────────────────────────────────────────────
  lambda_fp: 5.0
  # ── Endpoint action reconstruction (fixed stride T=5) ────────────────────
  # Decoder: φ(z_t, z_{t+5}) → [u_t, …, u_{t+4}]
  # All 6 pairs in the H=10 horizon contribute each step (dense supervision).
  lambda_action_reconstruction: 1.0
  action_reconstruction_mode: fixed_stride
  action_reconstruction_stride: 5       # T — gap between endpoint frames
  action_reconstruction_hidden_dim: 256
  action_reconstruction_n_layers: 3
  action_reconstruction_use_delta: true  # input: concat(z_s, z_e, z_e−z_s)
  # ── All other losses off ─────────────────────────────────────────────────
  lambda_inv: 0.0
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  use_vicreg: false
  vicreg_lambda: 5.0
  vicreg_nu: 1.0
  lambda_pred_vicreg: 0.0
  lambda_mirror: 0.0
  lambda_spec: 0.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  lambda_PBH: 0.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  lambda_dynSIG: 0.0
  lambda_varfloor: 0.0
  lambda_temp: 0.0
  lambda_B_align: 0.0
  # ── Training dynamics ─────────────────────────────────────────────────────
  use_target_encoder: false
  detach_targets: false
  target_encoder_momentum: 0.996
  aug_noise_std: 0.0
  predictor_lr_mult: 5.0
  predictor_window: 3
  num_workers: 2
  checkpoint_every: 10
  warmup_epochs: 0
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 0
  encoder_lr_unfreeze_mult: 1.0
  jacobian_every: 10
  rho_max_init: 1.5
  local_state_threshold: 0.05
  unstable_eta: 0.05
  normalize_actions: true
  normalize_states: true

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 0.3
  n_trials: 50

data:
  train_frac: 0.8
  val_frac: 0.1
  n_random_episodes: 450
  random_ep_len: 200
  n_passive_episodes: 1200
  passive_ep_len: 50
  passive_init_range: 0.05
  random_init_range: 1.0
