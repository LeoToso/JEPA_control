environment:
  name: cartpole
  frame_skip: 1
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 32
  action_latent_dim: 4       # action lifting: u(R^1) -> c(R^4), B becomes (32x4)
  action_encoder: linear     # linear lifting W in R^{4x1}
  patch_size: 8
  frame_stack: 1
  predictor_window: 3
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_hidden_dim: 256
  predictor_n_layers: 2

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 200
  horizon: 10
  lambda_pred: 1.0
  lambda_state: 0.0
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  lambda_inv: 0.0
  inv_action_scale: 10.0
  lambda_fp: 50.0            # fixed-point: f(z*,0)=z*
  lambda_spec: 0.0           # disabled: replaced by L_dynSIG + L_temp
  lambda_spec_marginal: 0.0
  lambda_PBH: 1.0            # re-enabled: now uses B_eff (d×1), forces scalar stabilisability
  lambda_local: 0.0
  lambda_unstable: 0.0
  unstable_eta: 0.05
  rho_max_init: 1.3
  local_state_threshold: 0.05
  jacobian_every: 10
  use_vicreg: false
  vicreg_lambda: 5.0
  lambda_sigreg: 0.0         # replaced by lambda_dynSIG
  sigreg_num_slices: 32
  sigreg_num_points: 9
  vicreg_nu: 1.0
  ema_momentum: 0.996
  state_encoder_grad_scale: 0.50
  predictor_lr_mult: 1.0
  predictor_window: 3
  checkpoint_every: 10
  warmup_epochs: 0
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 0    # train encoder from epoch 0 (was 9999 = frozen forever)
  encoder_lr_unfreeze_mult: 0.1
  # ── Dynamics-aware regularization ──────────────────────────────────────────
  lambda_dynSIG: 2.0         # near-eq only: Gramian target valid where linearization holds
  dynSIG_T_g: 5
  dynSIG_alpha: 0.3          # raised floor: prevents rank-4 Gramian dominating 28 dirs
  dynSIG_beta: 0.95
  dynSIG_near_eq_radius: 2.0 # apply dynSIG only to ||z_t - z*|| < 2.0 samples
  lambda_temp: 0.5           # temporal covariance consistency near equilibrium
  temp_near_eq_radius: 2.0
  lambda_inv: 0.0            # disabled: PBH with B_eff now handles action encoder alignment
  lambda_spec: 5.0           # forces rho(A_jac)→1.0827 (unstable mode recovery)

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

mpc:
  horizon: 10
  chunk_size: 1
  Q_f_multiplier: 10.0
  grad_lr: 0.05
  grad_n_iter: 100

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 3.0
  n_trials: 50

data:
  n_random: 100000         # 50k random + 50k LQR (mixed mode splits 50/50)
  train_frac: 0.8
  val_frac: 0.1
  random_init_range: 0.40
  lqr_init_range: 0.10
  lqr_noise_std: 0.25      # increased from 0.1: more action diversity near eq
  n_equilibrium: 1000      # increased from 500
  n_eq_selfloop: 500
  eq_init_range: 0.002
  eq_noise_std: 0.001
  # ── PRBS persistent excitation block ───────────────────────────────────────
  n_pe: 25000              # PRBS near-eq transitions for L_temp + Gramian PE
  pe_init_range: 0.05      # start close to upright (linear regime)
  pe_action_amplitude: 3.0 # ±3N: excites without instantly destabilizing
  pe_flip_prob: 0.15       # average hold = ~7 steps (temporal structure for W=3)
  pe_max_ep_len: 40        # reset before pole falls far from equilibrium
