environment:
  name: cartpole
  frame_skip: 1
  image_size: 64
  mass_cart: 1.0
  mass_pole: 0.1
  pole_length: 0.5
  gravity: 9.8
  dt: 0.02
  action_range: [-10, 10]

model:
  latent_dim: 8
  action_latent_dim: 1
  action_encoder: linear
  patch_size: 8
  frame_stack: 1
  predictor_window: 3
  vit_embed_dim: 128
  vit_depth: 4
  vit_num_heads: 4
  predictor_hidden_dim: 64
  predictor_n_layers: 2

training:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 200
  horizon: 10
  lambda_pred: 1.0
  lambda_state: 0.0             # NOT needed for CEM (linear control structure only)
  lambda_mirror: 0.0
  lambda_anchor: 0.0
  lambda_enc_anchor: 0.0
  lambda_inv: 0.0
  inv_action_scale: 10.0
  lambda_fp: 30.0              # increased: force ||f(z*,0)-z*|| → 0 so A_jac is reliable at z*
  lambda_spec: 5.0
  lambda_spec_marginal: 0.0
  lambda_spec_eig: 0.0
  spec_eig_warmup_epochs: 80
  spec_eig_epsilon: 0.15
  lambda_PBH: 1.0
  lambda_local: 0.0
  lambda_unstable: 0.0
  unstable_eta: 0.05
  rho_max_init: 1.3
  local_state_threshold: 0.05
  jacobian_every: 10
  use_vicreg: false            # replaced by dynSIGreg (dynamics-aware SIGreg)
  vicreg_lambda: 25.0
  lambda_sigreg: 0.0
  lambda_varfloor: 0.0
  sigreg_num_slices: 32
  sigreg_num_points: 9
  vicreg_nu: 1.0
  ema_momentum: 0.996
  use_target_encoder: true        # use EMA target encoder for z_rest targets
  target_encoder_momentum: 0.99
  aug_noise_std: 0.0              # disabled: saves one encoder pass/batch; VICReg handles collapse
  state_encoder_grad_scale: 0.50
  predictor_lr_mult: 1.0
  predictor_window: 3
  checkpoint_every: 10
  warmup_epochs: 0
  warmup_lambda_state: 0.0
  freeze_encoder_epochs: 0
  encoder_lr_unfreeze_mult: 0.1
  # ── Dynamics-aware regularization ──────────────────────────────────────────
  # dynSIGreg replaces VICReg: shapes encoder covariance to match the controllability
  # Gramian W_T = Σ A^k B B^T (A^T)^k.  Gramian is detach()ed so no gradient flows
  # through A_jac — no Jacobian-coupling oscillations (unlike spec/PBH).
  # Starts isotropic (Sigma_target = I) for first jacobian_every epochs, then updates.
  lambda_dynSIG: 2.0
  dynSIG_T_g: 5
  dynSIG_alpha: 0.3
  dynSIG_beta: 0.95
  dynSIG_near_eq_radius: 0.0
  lambda_temp: 0.0
  temp_near_eq_radius: 2.0

probes:
  epsilon_lambda: 0.05
  delta_tol: 0.05
  n_trials_control: 30
  n_trials_grad_mpc: 10
  T_rollout: 200

control:
  R_lqr: 0.01
  init_scale: 0.05
  stabilization_threshold: 0.1
  settling_threshold: 0.05

mpc:
  horizon: 10
  chunk_size: 1
  Q_f_multiplier: 10.0
  grad_lr: 0.05
  grad_n_iter: 100

cem:
  horizon: 25
  chunk_size: 1
  n_samples: 500
  n_elites: 50
  n_iter: 5
  init_std: 3.0
  n_trials: 50

data:
  train_frac: 0.8
  val_frac: 0.1
  # Random: 50 ep × 200 steps = 10,000 transitions (wide exploration, ±57°)
  n_random_episodes: 50
  random_ep_len: 200
  random_init_range: 1.0
  # LQR: 100 ep × 100 steps = 10,000 transitions (starts up to ±17°)
  n_lqr_episodes: 100
  lqr_ep_len: 100
  lqr_init_range: 0.10
  lqr_noise_std: 0.0
  # Equilibrium: 10 ep × 50 steps = 500 transitions (near z*, tiny u)
  n_equilibrium: 500
  eq_ep_len: 50
  n_eq_selfloop: 200
  eq_init_range: 0.002
  eq_noise_std: 0.001
  # PRBS: 125 ep × 40 steps = 5,000 transitions (persistent excitation)
  n_pe_episodes: 125
  pe_ep_len: 40
  pe_init_range: 0.05
  pe_action_amplitude: 3.0
  pe_flip_prob: 0.15
  # Passive: 40 ep × 50 steps = 2,000 transitions (u=0; 0.05 → ~1 rad in 1s)
  n_passive_episodes: 40
  passive_ep_len: 50
  passive_init_range: 0.05
