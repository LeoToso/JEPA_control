[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-lds"
version = "0.1.0"
description = "Toy discrete-time LTI examples for studying JEPA representation collapse of unstable modes"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
